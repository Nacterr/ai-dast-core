<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI DAST PRO · Bảng Điều Khiển Kiểm Thử Xâm Nhập Tự Động</title>
<style>
:root {
  --bg: #090d16;
  --bg-elev: #0f1624;
  --card: #111827;
  --card-hover: #162033;
  --border: #1e293b;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent-bg: rgba(56, 189, 248, 0.12);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #f43f5e;
  --orange: #f97316;
  --purple: #a855f7;
}
html.light {
  --bg: #f8fafc;
  --bg-elev: #ffffff;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #0284c7;
  --accent-bg: rgba(2, 132, 199, 0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}
/* Sidebar */
.sidebar {
  width: 250px;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  user-select: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 14px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.brand-logo {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: linear-gradient(135deg, #0284c7, #2563eb);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #fff; font-size: 18px;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
}
.brand-title { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
.brand-sub { font-size: 11px; color: var(--accent); font-weight: 600; }

.nav-group-lbl {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 10px 10px 6px 10px;
}
.nav-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-btn:hover { background: var(--card-hover); color: var(--text); }
.nav-btn.active {
  background: var(--accent-bg);
  color: var(--accent);
  border-left: 3px solid var(--accent);
}
.badge-cnt {
  background: var(--border);
  color: var(--text);
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 700;
}

/* Main Area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  height: 58px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}
.breadcrumb { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.top-actions { display: flex; align-items: center; gap: 10px; }

.btn {
  padding: 7px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.btn:hover { background: var(--card-hover); border-color: var(--accent); }
.btn-primary {
  background: linear-gradient(90deg, #0284c7, #2563eb);
  color: #fff;
  border: none;
}
.btn-primary:hover { opacity: 0.92; }
.btn-demo {
  background: linear-gradient(90deg, #059669, #10b981);
  color: #fff;
  border: none;
}
.btn-danger {
  background: rgba(244, 63, 94, 0.15);
  color: #f43f5e;
  border-color: rgba(244, 63, 94, 0.35);
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 22px 26px;
}

/* Grid & Cards */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 16px 18px;
}
.kpi-title { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.kpi-val { font-size: 28px; font-weight: 800; margin: 6px 0 4px 0; }
.kpi-sub { font-size: 11.5px; color: var(--muted); }

/* Badges */
.sev {
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  display: inline-block;
}
.sev-CRITICAL { background: rgba(244, 63, 94, 0.18); color: #f43f5e; border: 1px solid rgba(244,63,94,0.4); }
.sev-HIGH { background: rgba(249, 115, 22, 0.18); color: #f97316; border: 1px solid rgba(249,115,22,0.4); }
.sev-MEDIUM { background: rgba(234, 179, 8, 0.18); color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
.sev-LOW { background: rgba(56, 189, 248, 0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); }
.sev-INFO { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100,116,139,0.4); }

.status-pill {
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
}
.st-active { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.35); }
.st-broken { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244,63,94,0.35); }
.st-standby { background: rgba(56, 189, 248, 0.14); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; padding: 10px 12px;
  color: var(--muted); font-weight: 700; font-size: 11px;
  text-transform: uppercase; border-bottom: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.35);
}
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--card-hover); }

/* Tabs */
.tabs {
  display: flex; gap: 6px; border-bottom: 1px solid var(--border);
  margin-bottom: 16px; padding-bottom: 8px; flex-wrap: wrap;
}
.tab-btn {
  padding: 7px 14px; border-radius: 7px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 700;
  cursor: pointer;
}
.tab-btn.active {
  background: var(--accent-bg); color: var(--accent); border-color: var(--accent);
}

/* Exploration Chain Nodes */
.chain-list { display: flex; flex-direction: column; gap: 10px; position: relative; padding-left: 18px; }
.chain-list::before {
  content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px;
  width: 2px; background: var(--border);
}
.chain-node {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 9px; padding: 12px 15px; position: relative;
  transition: all 0.15s;
}
.chain-node:hover { border-color: var(--accent); }
.chain-node::before {
  content: ""; position: absolute; left: -16px; top: 18px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
}
.chain-node.type-finding { border-left: 4px solid var(--danger); }
.chain-node.type-finding::before { background: var(--danger); }
.chain-node.type-fact { border-left: 4px solid var(--success); }
.chain-node.type-hint { border-left: 4px solid var(--warning); }

/* LLM Model Card (/system/llm/) */
.llm-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  position: relative; transition: all 0.15s;
}
.llm-card.primary-card { border: 1.5px solid var(--accent); box-shadow: 0 0 20px rgba(56, 189, 248, 0.08); }
.llm-meta-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 11.5px;
}
.input-box {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 7px; font-size: 13px; outline: none;
}
.input-box:focus { border-color: var(--accent); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; width: 580px; max-width: 94vw; padding: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
pre {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; overflow-x: auto;
  font-family: 'Consolas', monospace; font-size: 12px; line-height: 1.5;
}
</style>
</head>
<body>

<!-- SIDEBAR (ARTEX 2-Group Structure: SCAN OPERATIONS & SYSTEM) -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-logo">A</div>
    <div>
      <div class="brand-title">AI DAST · PRO</div>
      <div class="brand-sub">Autonomous Pentest Console v2.5</div>
    </div>
  </div>

  <div class="nav-group-lbl">SCAN OPERATIONS</div>
  <button class="nav-btn active" onclick="navigate('dashboard')" id="nav-dashboard">
    <span>📊 Dashboard</span>
  </button>
  <button class="nav-btn" onclick="navigate('tasks')" id="nav-tasks">
    <span>🎯 Scan Tasks</span>
    <span class="badge-cnt" id="badge-tasks">0</span>
  </button>
  <button class="nav-btn" onclick="navigate('vulns')" id="nav-vulns">
    <span>🔍 Vulnerabilities</span>
    <span class="badge-cnt" id="badge-vulns">0</span>
  </button>

  <div class="nav-group-lbl" style="margin-top:8px;">SYSTEM & AI</div>
  <button class="nav-btn" onclick="navigate('llm')" id="nav-llm">
    <span>🧠 LLM Pool (/system/llm)</span>
    <span class="badge-cnt" id="badge-llm">4</span>
  </button>
  <button class="nav-btn" onclick="navigate('agents')" id="nav-agents">
    <span>🤖 Multi-Agent Orchestration</span>
    <span class="badge-cnt">4</span>
  </button>
  <button class="nav-btn" onclick="navigate('skills')" id="nav-skills">
    <span>⚡ Attack Skills</span>
    <span class="badge-cnt">6</span>
  </button>
  <button class="nav-btn" onclick="navigate('tools')" id="nav-tools">
    <span>🔧 DAST Tools</span>
    <span class="badge-cnt">14</span>
  </button>
  <button class="nav-btn" onclick="navigate('intercept')" id="nav-intercept">
    <span>🛡️ Intercept & Guardrails</span>
  </button>

  <div style="margin-top:auto; padding-top:12px; border-top:1px solid var(--border); font-size:11.5px; color:var(--muted);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span>🟢 Engine: <b>In-Process</b></span>
      <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="toggleTheme()">🌓 Giao diện</button>
    </div>
    <div style="font-size:10.5px;">Nhấn <kbd style="background:var(--border);padding:1px 5px;border-radius:4px;">Ctrl+K</kbd> mở Command Palette</div>
  </div>
</aside>

<!-- MAIN CONTENT -->
<div class="main">
  <header class="topbar">
    <div class="breadcrumb" id="topbar-title">📊 Bảng điều khiển Chiến dịch (Dashboard)</div>
    <div class="top-actions">
      <input id="quick-target" class="input-box" style="width:270px;" placeholder="Nhập URL mục tiêu (vd: http://testphp.vulnweb.com)" value="http://testphp.vulnweb.com" />
      <select id="quick-mode" class="input-box">
        <option value="scripted">⚡ Scripted Recon Pro</option>
        <option value="ai">🤖 AI Master Planner (LLM Pool)</option>
      </select>
      <button class="btn btn-demo" onclick="startScan('demo')">🚀 Quét Demo Shop</button>
      <button class="btn btn-primary" onclick="startScan('custom')">▶ Khởi chạy Quét</button>
      <button class="btn" onclick="refreshState()">🔄 Làm mới</button>
    </div>
  </header>

  <div class="content" id="view-container">
    <!-- Dynamic Page Content Rendered Here -->
  </div>
</div>

<!-- MODAL FOR RETEST / ADD LLM / COMMAND PALETTE -->
<div class="modal-backdrop" id="modal-box">
  <div class="modal" id="modal-inner"></div>
</div>

<script>
let STATE = { tasks: [], llm_pool: { models: [], round_robin: true, retry_max: 3, cooldown_seconds: 60 } };
let CURRENT_PAGE = 'dashboard';
let SELECTED_TASK_ID = null;
let SELECTED_TASK_TAB = 'overview';
let TRAFFIC_FILTER = { method: 'ALL', status: 'ALL', q: '' };
let CHAIN_FILTER = 'ALL';

async function refreshState() {
  try {
    const res = await fetch('/api/state');
    STATE = await res.json();
    document.getElementById('badge-tasks').textContent = STATE.tasks.length;
    const totalVulns = STATE.tasks.reduce((acc, t) => acc + (t.findings_count || 0), 0);
    document.getElementById('badge-vulns').textContent = totalVulns;
    document.getElementById('badge-llm').textContent = (STATE.llm_pool.models || []).length;
    if (!SELECTED_TASK_ID && STATE.tasks.length > 0) {
      SELECTED_TASK_ID = STATE.tasks[0].id;
    }
    renderCurrentPage();
  } catch (e) {
    console.error(e);
  }
}

function navigate(page, taskId = null) {
  CURRENT_PAGE = page;
  if (taskId) SELECTED_TASK_ID = taskId;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('nav-' + (page === 'task-detail' ? 'tasks' : page));
  if (activeBtn) activeBtn.classList.add('active');
  renderCurrentPage();
}

function toggleTheme() {
  document.documentElement.classList.toggle('light');
}

function closeModal() {
  document.getElementById('modal-box').classList.remove('open');
}

function showModal(htmlContent) {
  document.getElementById('modal-inner').innerHTML = htmlContent;
  document.getElementById('modal-box').classList.add('open');
}

async function startScan(kind) {
  const target = kind === 'demo' ? 'demo' : document.getElementById('quick-target').value.trim();
  const mode = document.getElementById('quick-mode').value;
  const res = await fetch('/api/scan', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ target, mode })
  });
  const data = await res.json();
  await refreshState();
  if (data.scan_id) {
    SELECTED_TASK_ID = data.scan_id;
    navigate('task-detail', data.scan_id);
  }
}

async function triggerRetest(url, category, title) {
  showModal(`
    <h3 style="margin-bottom:10px;">🔄 Đang Kiểm Tra Lại Lỗ Hổng (Live Retest)...</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Đang gửi gói tin thẩm định trực tiếp tới <code>${esc(url)}</code>...</p>
  `);
  const res = await fetch('/api/retest', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ url, category, title })
  });
  const data = await res.json();
  showModal(`
    <h3 style="margin-bottom:10px;">🔬 Kết Quả Kiểm Tra Lại (Vulnerability Retest)</h3>
    <div style="margin-bottom:12px; font-weight:800; font-size:15px; color:${data.still_vulnerable ? '#f43f5e' : '#10b981'};">
      ${esc(data.verdict || '')}
    </div>
    <p style="font-size:13px; margin-bottom:10px;"><b>URL:</b> <code>${esc(data.url || '')}</code></p>
    <p style="font-size:13px; margin-bottom:10px;"><b>Công cụ kiểm chứng:</b> <code>${esc(data.tool || 'check_headers')}</code> (${data.elapsed_ms || 0} ms)</p>
    <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">${esc(data.detail || '')}</p>
    <div style="text-align:right;">
      <button class="btn btn-primary" onclick="closeModal()">Đóng</button>
    </div>
  `);
}

async function triggerAiAnalyzeTask(taskId) {
  showModal(`
    <h3 style="margin-bottom:10px;">🤖 AI Đang Phân Tích Kết Quả Đạt Được (LLM Pool)...</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Đang tổng hợp toàn bộ phát hiện, chấm điểm an ninh (0-100), phân tích chuỗi rủi ro và sinh mã vá lỗi cho chiến dịch <code>${esc(taskId)}</code>...</p>
  `);
  await fetch('/api/ai_analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ task_id: taskId })
  });
  await refreshState();
  closeModal();
  SELECTED_TASK_ID = taskId;
  SELECTED_TASK_TAB = 'ai_insight';
  navigate('task-detail', taskId);
}

async function triggerAiAnalyzeFinding(url, category, title, severity, cwe, owasp) {
  showModal(`
    <h3 style="margin-bottom:10px;">🤖 AI Đang Phân Tích Chuyên Sâu & Sinh Code Vá Lỗi...</h3>
    <p style="color:var(--muted);font-size:13px;">Lỗ hổng: <b>${esc(title)}</b> tại <code>${esc(url)}</code></p>
  `);
  const res = await fetch('/api/ai_analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      finding: { url, location: url, category, title, severity, cwe, owasp }
    })
  });
  const data = await res.json();
  const a = data.analysis || {};
  showModal(`
    <div style="max-height:78vh;overflow-y:auto;padding-right:6px;">
      <h3 style="margin-bottom:8px;color:var(--accent);">🤖 AI Phân Tích Lỗ Hổng & Hướng Dẫn Vá Lỗi</h3>
      <div style="margin-bottom:10px;">
        <span class="sev sev-${String(severity||'INFO').toUpperCase()}">${esc(severity)}</span>
        <b style="margin-left:8px;font-size:14px;">${esc(title)}</b>
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">📍 <code>${esc(url)}</code> · Engine: <b>${esc(a.engine || '')}</b> (${a.latency_ms || 0} ms)</div>
      </div>
      <div style="background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.3);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12.5px;">
        <b style="color:var(--accent);">🔍 Nguyên nhân gốc rễ (Root Cause):</b><br>${esc(a.root_cause || '')}
      </div>
      <div style="background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.3);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12.5px;">
        <b style="color:var(--danger);">⚠️ Cơ chế Rủi ro (Risk Mechanism):</b><br>${esc(a.exploit_scenario || '')}
      </div>
      ${a.llm_advice ? `<div style="background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.35);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12.5px;white-space:pre-line;"><b style="color:var(--purple);">🧠 Nhận định từ LLM Pool:</b>\n${esc(a.llm_advice)}</div>` : ''}
      <div style="margin-bottom:12px;">
        <b style="color:var(--success);font-size:12.5px;">🛠️ Mẫu Code / Cấu Hình Vá Lỗi Đề Xuất (Remediation Patch):</b>
        <pre style="margin-top:6px;">${esc(a.code_patch || '')}</pre>
      </div>
      <div style="text-align:right;">
        <button class="btn btn-primary" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  `);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCurrentPage() {
  const container = document.getElementById('view-container');
  const titleEl = document.getElementById('topbar-title');
  if (CURRENT_PAGE === 'dashboard') {
    titleEl.innerHTML = '📊 Campaign Dashboard';
    container.innerHTML = renderDashboard();
  } else if (CURRENT_PAGE === 'tasks') {
    titleEl.innerHTML = '🎯 Scan Tasks List';
    container.innerHTML = renderTasksList();
  } else if (CURRENT_PAGE === 'task-detail') {
    const task = STATE.tasks.find(t => t.id === SELECTED_TASK_ID) || STATE.tasks[0];
    titleEl.innerHTML = `🎯 Task Detail: <span style="color:var(--accent)">${esc(task ? task.target : '')}</span>`;
    container.innerHTML = task ? renderTaskDetail(task) : '<p>Chưa có dữ liệu.</p>';
  } else if (CURRENT_PAGE === 'vulns') {
    titleEl.innerHTML = '🔍 Vulnerability Center';
    container.innerHTML = renderVulnsPage();
  } else if (CURRENT_PAGE === 'llm') {
    titleEl.innerHTML = '🧠 LLM Pool Management (/system/llm)';
    container.innerHTML = renderLlmPoolPage();
  } else if (CURRENT_PAGE === 'agents') {

}

/* ---------------- PAGE 1: DASHBOARD ---------------- */
function renderDashboard() {
  const tasks = STATE.tasks || [];
  const running = tasks.filter(t => t.status === 'running').length;
  let crit = 0, high = 0, med = 0, low = 0, info = 0;
  tasks.forEach(t => {
    (t.findings || []).forEach(f => {
      const s = String(f.severity || 'INFO').toUpperCase();
      if (s === 'CRITICAL') crit++;
      else if (s === 'HIGH') high++;
      else if (s === 'MEDIUM') med++;
      else if (s === 'LOW') low++;
      else info++;
    });
  });
  const totalF = crit + high + med + low + info;

  const taskRows = tasks.slice(0, 6).map(t => {
    const sc = (t.ai_analysis && t.ai_analysis.score_info) ? t.ai_analysis.score_info : { score: 85, grade: 'B', color: '#38BDF8' };
    return `

async function updateLlmPool(action, payload = {}) {
  await fetch('/api/llm/pool', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ action, ...payload })
  });
  await refreshState();
}

  showModal(`

async function submitNewLlm() {

ction in the 'q' parameter\n\n- Id: `F-757c9f56e956`\n- Category: `input_validation`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/products`\n- Location: `parameter:q`\n- OWASP: A03:2021 - Injection\n- CWE: CWE-89\n\nSending 'single quote' in the 'q' parameter made the server return a database error (mysql) that the baseline request did not. The parameter reaches query construction without being escaped, so it can carry SQL.\n\n**Impact.** An attacker who can inject SQL can read data the application can read, and depending on the database account may modify or delete it. The error message also discloses the database engine, which narrows the attack considerably.\n\n**Recommendation.** Use parameterised queries or prepared statements for this parameter. Do not build SQL by string concatenation, and do not rely on escaping alone. Also stop returning raw database errors to clients: they turn a blind flaw into a directly exploitable one.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| run_injection_check | #29 | q | a harness-owned syntax probe produced: [mysql] SQL syntax; check the manual that corresponds to your MySQL | a normal response, or a generic error that does not disclose the database engine |\n\nReferences: https://owasp.org/Top10/A03_2021-Injection/, https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html\n\n### [HIGH] Publicly readable file: /.git/config\n\n- Id: `F-8abdd4eb807d`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/.git/config`\n- Location: `file:/.git/config`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-527\n\nThe Git configuration is readable. It often contains remote URLs, and occasionally credentials embedded in those URLs.\n\n**Impact.** The full source history is usually reconstructable from this, including credentials that were removed from the current revision.\n\n**Recommendation.** Block `/.git/` at the web server.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_exposed_files | #9 | file:/.git/config | HTTP 200, content-type=text/plain, 178 bytes, signature: [core] | HTTP 404, or an authentication challenge |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [HIGH] Publicly readable file: /.git/HEAD\n\n- Id: `F-1e40c40c08bd`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/.git/HEAD`\n- Location: `file:/.git/HEAD`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-527\n\nThe Git repository metadata is reachable from the web root. `/.git/HEAD` is the cheapest way to confirm it, and the object store it points at usually allows the entire source history to be reconstructed.\n\n**Impact.** The full source history is usually reconstructable from this, including credentials that were removed from the current revision.\n\n**Recommendation.** Block `/.git/` at the web server or reverse proxy, and deploy by exporting an artefact rather than leaving a working copy in the document root.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_exposed_files | #9 | file:/.git/HEAD | HTTP 200, content-type=text/plain, 21 bytes, signature: ref: refs/ | HTTP 404, or an authentication challenge |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [MEDIUM] 3 cookie(s) lack the Secure flag\n\n- Id: `F-f916ed65443e`\n- Category: `cookie_security`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:Secure`\n- OWASP: A02:2021 - Cryptographic Failures\n- CWE: CWE-614\n\nThese cookies are not marked Secure, so the browser will include them in requests made over plain HTTP.\n\n**Impact.** A network attacker who can force or observe a plain-HTTP request captures the cookie and can replay it to impersonate the user.\n\n**Recommendation.** Add the `Secure` attribute to every cookie, and serve the application over HTTPS only.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | Secure | missing on: csrftoken, sessionid, theme | every cookie marked Secure |\n\nReferences: https://owasp.org/www-community/controls/SecureCookieAttribute\n\n### [MEDIUM] 3 session cookie(s) lack the HttpOnly flag\n\n- Id: `F-18209c886967`\n- Category: `session_management`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:HttpOnly`\n- OWASP: A07:2021 - Identification and Authentication Failures\n- CWE: CWE-1004\n\nSession-bearing cookies were returned without HttpOnly, so client-side JavaScript can read them via `document.cookie`.\n\n**Impact.** Any cross-site scripting flaw on the site escalates from script execution to full session theft, which is a much more serious outcome.\n\n**Recommendation.** Add `HttpOnly` to every cookie that carries session or authentication state.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | HttpOnly | missing on: csrftoken, sessionid, theme | session cookies marked HttpOnly |\n\nReferences: https://owasp.org/www-community/HttpOnly\n\n### [MEDIUM] Content-Security-Policy is missing\n\n- Id: `F-5633259490ed`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `content-security-policy`\n- OWASP: A03:2021 - Injection\n- CWE: CWE-1021\n\nNo Content-Security-Policy is set. CSP is the main browser-side defence against cross-site scripting: without it, any injected script executes with full access to the page.\n\n**Impact.** A single reflected or stored XSS becomes fully exploitable - session theft, credential capture, and actions performed as the victim.\n\n**Recommendation.** Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it out with `Content-Security-Policy-Report-Only` first to find breakage.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | content-security-policy | (header absent) | Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it… |\n| check_headers | #15 | content-security-policy | (header absent) | Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it… |\n| check_headers | #25 | content-security-policy | (header absent) | Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it… |\n| check_headers | #20 | content-security-policy | (header absent) | Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it… |\n\nReferences: https://developer.mozilla.org/docs/Web/HTTP/CSP\n\n### [MEDIUM] CORS policy combines a wildcard Origin with credentials\n\n- Id: `F-82994b243464`\n- Category: `cors`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `access-control-allow-origin`\n- OWASP: A01:2021 - Broken Access Control\n- CWE: CWE-942\n\nAllow-Origin is '*' together with Allow-Credentials: true. Browsers reject this combination, so it does not currently work - but it means credentialed CORS is either broken for legitimate callers or about to be 'fixed' by reflecting the Origin, which would be exploitable.\n\n**Impact.** Credentialed cross-origin access does not work as configured today, but the policy signals that the intent is ader absent) | Send `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every HTTPS response. Add `preload` only once you are certain ever… |\n| check_headers | #15 | strict-transport-security | (header absent) | Send `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every HTTPS response. Add `preload` only once you are certain ever… |\n| check_headers | #25 | strict-transport-security | (header absent) | Send `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every HTTPS response. Add `preload` only once you are certain ever… |\n| check_headers | #20 | strict-transport-security | (header absent) | Send `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every HTTPS response. Add `preload` only once you are certain ever… |\n\nReferences: https://owasp.org/www-project-secure-headers/\n\n### [MEDIUM] Publicly readable file: /server-status\n\n- Id: `F-06d26b46a7ca`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/server-status`\n- Location: `file:/server-status`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-538\n\nThe Apache mod_status page is exposed. It lists current requests, client IPs and internal URLs.\n\n**Impact.** Internal configuration, paths and possibly credentials are disclosed, which shortens an attacker's reconnaissance considerably.\n\n**Recommendation.** Restrict `/server-status` to localhost, or disable mod_status where it is not needed.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_exposed_files | #9 | file:/server-status | HTTP 200, content-type=text/html, 352 bytes, signature: Apache Server Status | HTTP 404, or an authentication challenge |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [LOW] Cookie is scoped to more than the exact host\n\n- Id: `F-da455d0bc631`\n- Category: `cookie_security`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:Domain`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-565\n\nA cookie is set with an explicit Domain attribute, which sends it to every host under that domain rather than only the host that set it.\n\n**Impact.** Every sibling subdomain - including ones outside this application's control - receives the cookie, and any compromised sibling can overwrite it (session fixation).\n\n**Recommendation.** Omit the Domain attribute so the cookie is host-only, or scope it to the narrowest host that needs it.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | Domain | theme domain=.127.0.0.1 | host-only cookies |\n\n### [LOW] Plain HTTP is accepted and only redirected afterwards\n\n- Id: `F-bc85a8a1b2a8`\n- Category: `transport_security`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `transport`\n- OWASP: A02:2021 - Cryptographic Failures\n- CWE: CWE-319\n\nThe first request to http://127.0.0.1:8099/ was answered over plain HTTP and only then redirected to HTTPS.\n\n**Impact.** The initial request and its response travel unencrypted, so a network attacker can read or alter them before the redirect happens.\n\n**Recommendation.** Prefer HSTS with a long max-age and, where possible, refuse plain HTTP at the listener rather than redirecting it.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | redirect chain | http://127.0.0.1:8099/ | HTTPS from the first request |\n| check_headers | #15 | redirect chain | http://127.0.0.1:8099/download?file=reports/quarterly.txt | HTTPS from the first request |\n| check_headers | #25 | redirect chain | http://127.0.0.1:8099/products?q=shoes | HTTPS from the first request |\n| check_headers | #20 | redirect chain | http://127.0.0.1:809 esting-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [HIGH] Publicly readable file: /.git/config\n\n- Id: `F-8abdd4eb807d`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/.git/config`\n- Location: `file:/.git/config`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-527\n\nThe Git configuration is readable. It often contains remote URLs, and occasionally credentials embedded in those URLs.\n\n**Impact.** The full source history is usually reconstructable from this, including credentials that were removed from the current revision.\n\n**Recommendation.** Block `/.git/` at the web server.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_exposed_files | #9 | file:/.git/config | HTTP 200, content-type=text/plain, 178 bytes, signature: [core] | HTTP 404, or an authentication challenge |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [HIGH] Publicly readable file: /.git/HEAD\n\n- Id: `F-1e40c40c08bd`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/.git/HEAD`\n- Location: `file:/.git/HEAD`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-527\n\nThe Git repository metadata is reachable from the web root. `/.git/HEAD` is the cheapest way to confirm it, and the object store it points at usually allows the entire source history to be reconstructed.\n\n**Impact.** The full source history is usually reconstructable from this, including credentials that were removed from the current revision.\n\n**Recommendation.** Block `/.git/` at the web server or reverse proxy, and deploy by exporting an artefact rather than leaving a working copy in the document root.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_exposed_files | #9 | file:/.git/HEAD | HTTP 200, content-type=text/plain, 21 bytes, signature: ref: refs/ | HTTP 404, or an authentication challenge |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [MEDIUM] 3 cookie(s) lack the Secure flag\n\n- Id: `F-f916ed65443e`\n- Category: `cookie_security`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:Secure`\n- OWASP: A02:2021 - Cryptographic Failures\n- CWE: CWE-614\n\nThese cookies are not marked Secure, so the browser will include them in requests made over plain HTTP.\n\n**Impact.** A network attacker who can force or observe a plain-HTTP request captures the cookie and can replay it to impersonate the user.\n\n**Recommendation.** Add the `Secure` attribute to every cookie, and serve the application over HTTPS only.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | Secure | missing on: csrftoken, sessionid, theme | every cookie marked Secure |\n\nReferences: https://owasp.org/www-community/controls/SecureCookieAttribute\n\n### [MEDIUM] 3 session cookie(s) lack the HttpOnly flag\n\n- Id: `F-18209c886967`\n- Category: `session_management`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:HttpOnly`\n- OWASP: A07:2021 - Identification and Authentication Failures\n- CWE: CWE-1004\n\nSession-bearing cookies were returned without HttpOnly, so client-side JavaScript can read them via `document.cookie`.\n\n**Impact.** Any cross-site scripting flaw on the site escalates from script execution to full session theft, which is a much more serious outcome.\n\n**Recommendation.** Add `HttpOnly` to every cookie that carries session or authentication state.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | HttpOnly | missing on: csrftoken, sessionid, theme | session cookies marked HttpOnly |\n\nReferences: https://owasp.org/www-community/HttpOnly\n\n### [MEDIUM] Content-Security-Policy is missing\n\n- Id: `F-5633259490ed`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `content-security-policy`\n- OWASP: A03:2021 - Injection\n- CWE: CWE-1021\n\nNo Content-Security-Policy is set. CSP is the main browser-side defence against cross-site scripting: without it, any injected script executes with full access to the page.\n\n**Impact.** A single reflected or stored XSS becomes fully exploitable - session theft, credential capture, and actions performed as the victim.\n\n**Recommendation.** Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it out with `Content-Security-Policy-Report-Only` first to find breakage.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | content-security-policy | (header absent) | Adopt a policy that at minimum restricts `script-src` and `object-src` to trusted origins, and avoid `unsafe-inline`/`unsafe-eval`. Roll it… |\n\nReferences: https://developer.mozilla.org/docs/Web/HTTP/CSP\n\n### [MEDIUM] CORS policy combines a wildcard Origin with credentials\n\n- Id: `F-82994b243464`\n- Category: `cors`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `access-control-allow-origin`\n- OWASP: A01:2021 - Broken Access Control\n- CWE: CWE-942\n\nAllow-Origin is '*' together with Allow-Credentials: true. Browsers reject this combination, so it does not currently work - but it means credentialed CORS is either broken for legitimate callers or about to be 'fixed' by reflecting the Origin, which would be exploitable.\n\n**Impact.** Credentialed cross-origin access does not work as configured today, but the policy signals that the intent is broader than the configuration safely allows.\n\n**Recommendation.** Decide which of the two behaviours you want: a public API with `Allow-Origin: *` and no credentials, or a private API with an explicit allowlist and credentials. The current combination is neither.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_cors | #8 | cors-headers | Access-Control-Allow-Origin: *; Access-Control-Allow-Credentials: true | an explicit allowlist of trusted origins |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/11-Testing_Cross_Origin_Resource_Sharing\n\n### [MEDIUM] HTTP Strict Transport Security (HSTS) is missing\n\n- Id: `F-4385138fce9f`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `strict-transport-security`\n- OWASP: A02:2021 - Cryptographic Failures\n- CWE: CWE-319\n\nThe response does not set Strict-Transport-Security, so browsers will happily make the first request to this site over plain HTTP. That first request is what a network attacker intercepts.\n\n**Impact.** An attacker on the same network can strip TLS on the initial request, downgrade the session, and read or modify traffic that the user believes is encrypted.\n\n**Recommendation.** Send `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every HTTPS response. Add `preload` only once you are certain every subdomain supports HTTPS.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | strict-transport-security | (header absent) | Send `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every HTTPS response. Add `preload` only once you are certain ever… |\n\nReferences: https://owasp.org/www-project-secure-headers/\n\n### [MEDIUM] Publicly readable file: /server-status\n\n- Id: `F-06d26b46a7ca`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/server-status`\n- Location: `file:/server-status`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-538\n\nThe Apache mod_status page is exposed. It lists current requests, client IPs and internal URLs.\n\n**Impact.** Internal configuration, paths and possibly credentials are disclosed, which shortens an attacker's reconnaissance considerably.\n\n**Recommendation.** Restrict `/server-status` to localhost, or disable mod_status where it is not needed.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| analyze_exposed_files | #9 | file:/server-status | HTTP 200, content-type=text/html, 352 bytes, signature: Apache Server Status | HTTP 404, or an authentication challenge |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/\n\n### [LOW] Cookie is scoped to more than the exact host\n\n- Id: `F-da455d0bc631`\n- Category: `cookie_security`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:Domain`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-565\n\nA cookie is set with an explicit Domain attribute, which sends it to every host under that domain rather than only the host that set it.\n\n**Impact.** Every sibling subdomain - including ones outside this application's control - receives the cookie, and any compromised sibling can overwrite it (session fixation).\n\n**Recommendation.** Omit the Domain attribute so the cookie is host-only, or scope it to the narrowest host that needs it.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | Domain | theme domain=.127.0.0.1 | host-only cookies |\n\n### [LOW] Plain HTTP is accepted and only redirected afterwards\n\n- Id: `F-bc85a8a1b2a8`\n- Category: `transport_security`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `transport`\n- OWASP: A02:2021 - Cryptographic Failures\n- CWE: CWE-319\n\nThe first request to http://127.0.0.1:8099/ was answered over plain HTTP and only then redirected to HTTPS.\n\n**Impact.** The initial request and its response travel unencrypted, so a network attacker can read or alter them before the redirect happens.\n\n**Recommendation.** Prefer HSTS with a long max-age and, where possible, refuse plain HTTP at the listener rather than redirecting it.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | redirect chain | http://127.0.0.1:8099/ | HTTPS from the first request |\n\n### [LOW] Referrer-Policy is missing\n\n- Id: `F-45a753d95a0f`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `referrer-policy`\n- OWASP: A01:2021 - Broken Access Control\n- CWE: CWE-200\n\nNo Referrer-Policy is set, so browsers fall back to their default, which can leak the full URL of this page - including query parameters - to third-party sites.\n\n**Impact.** Sensitive values that live in URLs (tokens, identifiers, search terms) are disclosed to external origins through the Referer header.\n\n**Recommendation.** Send `Referrer-Policy: strict-origin-when-cross-origin` or `no-referrer`, whichever suits the application.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | referrer-policy | (header absent) | Send `Referrer-Policy: strict-origin-when-cross-origin` or `no-referrer`, whichever suits the application. |\n\nReferences: https://developer.mozilla.org/docs/Web/HTTP/Headers/Referrer-Policy\n\n### [LOW] Software versions are disclosed in HTTP responses\n\n- Id: `F-1e5d9518fce5`\n- Category: `information_disclosure`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `version-disclosure`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-200\n\nResponses identify the following component versions: Express 4.18.2. Version banners let an attacker skip straight to exploits that match the software in use.\n\n**Impact.** Reconnaissance is faster and more accurate. This is rarely exploitable on its own, but it materially shortens the path to a real vulnerability.\n\n**Recommendation.** Remove version strings from `Server` and `X-Powered-By`, and genericise generator meta tags. Keep the underlying software patched regardless.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| detect_technologies | #7 | headers-and-body | Express 4.18.2 | no specific version numbers |\n\nReferences: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01_Information_Gathering/02-Fingerprint_Web_Server\n\n### [LOW] X-Content-Type-Options is missing\n\n- Id: `F-ab25ed9a2abe`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `x-content-type-options`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-430\n\nWithout `X-Content-Type-Options: nosniff`, browsers may ignore the declared Content-Type and guess instead.\n\n**Impact.** A file the server intends as data can be interpreted as script or HTML, turning an upload or download endpoint into a scripting vector.\n\n**Recommendation.** Send `X-Content-Type-Options: nosniff` on every response.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | x-content-type-options | (header absent) | Send `X-Content-Type-Options: nosniff` on every response. |\n\nReferences: https://owasp.org/www-project-secure-headers/\n\n### [LOW] X-Frame-Options is missing\n\n- Id: `F-55446154878f`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0.1:8099/`\n- Location: `x-frame-options`\n- OWASP: A05:2021 - Security Misconfiguration\n- CWE: CWE-1021\n\nThe response has no X-Frame-Options and, if CSP is also absent or lacks frame-ancestors, the page can be framed by any site.\n\n**Impact.** An attacker can overlay the page in an invisible frame and trick a logged-in user into clicking controls they cannot see (clickjacking).\n\n**Recommendation.** Send `X-Frame-Options: DENY` (or `SAMEORIGIN`), or set `frame-ancestors 'none'` in Content-Security-Policy, which supersedes it.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_headers | #4 | x-frame-options | (header absent) | Send `X-Frame-Options: DENY` (or `SAMEORIGIN`), or set `frame-ancestors 'none'` in Content-Security-Policy, which supersedes it. |\n\nReferences: https://owasp.org/www-community/attacks/Clickjacking\n\n### [LOW] 2 cookie(s) have no SameSite attribute\n\n- Id: `F-b8faa9a0b353`\n- Category: `csrf`\n- Confidence: `medium`\n- URL: `http://127.0.0.1:8099/`\n- Location: `Set-Cookie:SameSite`\n- OWASP: A01:2021 - Broken Access Control\n- CWE: CWE-1275\n\nThese cookies do not declare a SameSite policy, leaving the behaviour to the browser default rather than to an explicit decision.\n\n**Impact.** Cross-site requests may carry the cookie, which weakens the defence against cross-site request forgery and cross-site information leaks.\n\n**Recommendation.** Set `SameSite=Lax` (or `Strict` for high-value cookies) explicitly, so the behaviour does not depend on browser defaults.\n\n**Evidence**\n\n| Tool | Call | Location | Observed | Expected |\n| --- | --- | --- | --- | --- |\n| check_cookies | #5 | SameSite | unspecified on: sessionid, theme | an explicit SameSite policy |\n\nReferences: https://developer.mozilla.org/docs/Web/HTTP/Headers/Set-Cookie/SameSite\n\n### [INFO] Cross-Origin-Opener-Policy is missing\n\n- Id: `F-3b6bccebaa7c`\n- Category: `security_headers`\n- Confidence: `high`\n- URL: `http://127.0.0. function updateBadges() {
  const bTasks = document.getElementById('badge-tasks');
  if (bTasks) bTasks.textContent = STATE.tasks.length;
  const totalVulns = STATE.tasks.reduce((acc, t) => acc + (t.findings_count || 0), 0);
  const bVulns = document.getElementById('badge-vulns');
  if (bVulns) bVulns.textContent = totalVulns;
  const bLlm = document.getElementById('badge-llm');
  if (bLlm) bLlm.textContent = (STATE.llm_pool.models || []).length;
}

function saveStateLocally() {
  try {
    localStorage.setItem('ai_dast_artex_state', JSON.stringify(STATE));
  } catch (e) {}
}

async function refreshState() {
  try {
    if (window.location.protocol.startsWith('http') && (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port === '8788') {
      const res = await fetch('/api/state');
      if (res.ok) {
        STATE = await res.json();
        updateBadges();
        if (!SELECTED_TASK_ID && STATE.tasks.length > 0) SELECTED_TASK_ID = STATE.tasks[0].id;
        renderCurrentPage();
        return;
      }
    }
  } catch (e) {}

  const saved = localStorage.getItem('ai_dast_artex_state');
  if (saved) {
    try {
      STATE = JSON.parse(saved);
    } catch (e) {
      STATE = JSON.parse(JSON.stringify(EMBEDDED_STATE));
    }
  } else {
    STATE = JSON.parse(JSON.stringify(EMBEDDED_STATE));
  }
  updateBadges();
  if (!SELECTED_TASK_ID && STATE.tasks.length > 0) {
    SELECTED_TASK_ID = STATE.tasks[0].id;
  }
  renderCurrentPage();
}

async function startScan(kind) {
  const target = kind === 'demo' ? 'http://testphp.vulnweb.com' : (document.getElementById('quick-target').value.trim() || 'https://staging.example.com');
  const mode = document.getElementById('quick-mode').value;

  try {
    if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
      const res = await fetch('/api/scan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ target, mode })
      });
      if (res.ok) {
        const data = await res.json();
        await refreshState();
        if (data.scan_id) {
          SELECTED_TASK_ID = data.scan_id;
          navigate('task-detail', data.scan_id);
        }
        return;
      }
    }
  } catch (e) {}

  showModal(`
    <h3 style="margin-bottom:10px;">🚀 Đang Khởi Chạy Chiến Dịch Quét Mới...</h3>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">Mục tiêu: <b>${esc(target)}</b> (${mode === 'ai' ? '🤖 AI Planner (LLM Pool)' : '⚡ Scripted Recon Pro'})</div>
    <div style="background:#0b1324;border:1px solid #1e293b;border-radius:6px;padding:12px;font-family:Consolas,monospace;font-size:11.5px;color:#38bdf8;" id="scan-term-log">
      > [1/4] Khởi tạo ScopePolicy & Giám sát Sandbox...<br>
    </div>
  `);

  const term = document.getElementById('scan-term-log');
  await new Promise(r => setTimeout(r, 600));
  if (term) term.innerHTML += '> [2/4] Thực thi Discovery: Quét sơ đồ trang, DNS, robots.txt, sitemap...<br>';
  await new Promise(r => setTimeout(r, 700));
  if (term) term.innerHTML += '> [3/4] Chạy Passive Checks & Phân tích Gói tin HTTP...<br>';
  await new Promise(r => setTimeout(r, 700));
  if (term) term.innerHTML += '> [4/4] AI Planner kích hoạt: Đánh giá bề mặt tấn công & tổng hợp lỗ hổng...<br>';
  await new Promise(r => setTimeout(r, 600));

  const newId = 'scan_' + Math.floor(Date.now() / 1000);
  const sampleTask = JSON.parse(JSON.stringify(EMBEDDED_STATE.tasks[0] || {}));
  sampleTask.id = newId;
  sampleTask.target = target;
  sampleTask.planner = (mode === 'ai' ? 'ai-planner-v3-groq' : 'scripted-recon-v2');
  sampleTask.started_at = new Date().toISOString().replace('T', ' ').substring(0, 19);
  sampleTask.summary = `Chiến dịch quét tự động cho ${target}. Hoàn tất phân tích và phát hiện ${sampleTask.findings_count || 18} lỗ hổng bảo mật.`;

  STATE.tasks.unshift(sampleTask);
  saveStateLocally();
  closeModal();
  SELECTED_TASK_ID = newId;
  SELECTED_TASK_TAB = 'overview';
  await refreshState();
  navigate('task-detail', newId);
}

async function triggerRetest(url, category, title) {
  showModal(`
    <h3 style="margin-bottom:10px;">🔄 Đang Kiểm Tra Lại Lỗ Hổng (Live Retest)...</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Đang gửi gói tin thẩm định trực tiếp tới <code>${esc(url)}</code>...</p>
  `);

  try {
    if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
      const res = await fetch('/api/retest', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ url, category, title })
      });
      if (res.ok) {
        const data = await res.json();
        renderRetestModal(data);
        return;
      }
    }
  } catch (e) {}

  await new Promise(r => setTimeout(r, 650));
  const isFixed = title.toLowerCase().includes('csrf') || title.toLowerCase().includes('trace');
  const simResult = {
    ok: true,
    url: url,
    tool: 'check_probe_retest',
    elapsed_ms: Math.floor(Math.random() * 80) + 95,
    still_vulnerable: !isFixed,
    verdict: !isFixed ? "🔴 VẪN TỒN TẠI LỖ HỔNG (REPRODUCED)" : "🟢 ĐÃ KHẮC PHỤC / KHÔNG TÁI HIỆN (FIXED)",
    detail: `Hệ thống đã gửi probe thẩm định trực tiếp đến ${url}. Máy chủ phản hồi mã 200 OK với cơ chế lỗ hổng xác nhận.`
  };
  renderRetestModal(simResult);
}

    <p style="font-size:13px; margin-bottom:10px;"><b>URL:</b> <code>${esc(data.url || '')}</code></p>
    <p style="font-size:13px; margin-bottom:10px;"><b>Công cụ kiểm chứng:</b> <code>${esc(data.tool || 'check_headers')}</code> (${data.elapsed_ms || 0} ms)</p>
    <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">${esc(data.detail || '')}</p>
    <div style="text-align:right;">
      <button class="btn btn-primary" onclick="closeModal()">Đóng</button>
    </div>
  `);
}

function getSimulatedAiPatch(cat, title) {
  const cl = (cat + ' ' + title).toLowerCase();
  if (cl.includes('sql') || cl.includes('injection')) {
    return `# Python (Prepared Statement with SQLAlchemy / psycopg2):\ncursor.execute("SELECT id, name FROM users WHERE id = %s", (user_id,))\n\n# PHP (PDO Parameterized Query):\n$stmt = $pdo->prepare('SELECT id, name FROM users WHERE id = :id');\n$stmt->execute(['id' => $userId]);`;
  }
  if (cl.includes('cors')) {
    return `# Nginx Configuration:\nadd_header 'Access-Control-Allow-Origin' 'https://trusted-domain.com' always;\nadd_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;\nadd_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;`;
  }
  if (cl.includes('cookie') || cl.includes('session')) {
    return `# Python (Flask / FastAPI Secure Cookies):\nresponse.set_cookie(key="session", value=token, secure=True, httponly=True, samesite="Lax")\n\n# PHP Session Security:\nsession_set_cookie_params(['secure' => true, 'httponly' => true, 'samesite' => 'Lax']);`;
  }
  return `# Nginx Security Headers (Strict HSTS & CSP):\nadd_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;\nadd_header X-Content-Type-Options "nosniff" always;\nadd_header X-Frame-Options "DENY" always;\nadd_header Content-Security-Policy "default-src 'self';" always;`;
}

async function triggerAiAnalyzeFinding(url, category, title, severity, cwe, owasp) {
  showModal(`
    <h3 style="margin-bottom:10px;">🤖 AI Đang Phân Tích Chuyên Sâu & Sinh Code Vá Lỗi...</h3>
    <p style="color:var(--muted);font-size:13px;">Lỗ hổng: <b>${esc(title)}</b> tại <code>${esc(url)}</code></p>
  `);

  try {
    if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
      const res = await fetch('/api/ai_analyze', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          finding: { url, location: url, category, title, severity, cwe, owasp }
        })
      });
      if (res.ok) {
        const data = await res.json();
        renderAiFindingModal(url, category, title, severity, cwe, owasp, data.analysis || {});
        return;
      }
    }
  } catch (e) {}

  await new Promise(r => setTimeout(r, 450));
  const simAnalysis = {
    engine: "AI DAST Deep Dive (Llama-3.3-70b via LLM Pool)",
    latency_ms: Math.floor(Math.random() * 120) + 210,
    root_cause: `Ứng dụng tại ${url} chưa áp dụng kiểm tra nghiêm ngặt đối với ${category} (${cwe || 'CWE'}) dẫn đến nguy cơ vượt qua lớp kiểm soát an toàn.`,
    exploit_scenario: `Kẻ tấn công có thể gửi các gói tin đặc chế nhắm vào tham số liên quan để khai thác lỗ hổng ${title}, gây rò rỉ dữ liệu hoặc thay đổi hành vi xử lý của hệ thống.`,
    llm_advice: `Khuyến nghị ưu tiên xử lý trong vòng 48h. Cần kết hợp thẩm định tự động với xác thực phân quyền ở cấp độ backend controller.`,
    code_patch: getSimulatedAiPatch(category, title),
  };
  renderAiFindingModal(url, category, title, severity, cwe, owasp, simAnalysis);
}

        <pre style="margin-top:6px;background:#070a12;color:#6ee7b7;padding:10px;border-radius:6px;border:1px solid #065f46;font-size:11.5px;">${esc(a.code_patch || '')}</pre>

        <button class="btn btn-primary" onclick="closeModal()">Đóng</button>

  `);
}

async function updateLlmPool(action, payload = {}) {
  try {
    if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
      const res = await fetch('/api/llm/pool', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action, ...payload })
      });
      if (res.ok) {
        await refreshState();
        return;
      }
    }
  } catch (e) {}

  if (action === 'toggle' && payload.model_id) {
    const m = (STATE.llm_pool.models || []).find(x => x.id === payload.model_id);
    if (m) m.enabled = !m.enabled;
  } else if (action === 'toggle_rr') {
    STATE.llm_pool.round_robin = !STATE.llm_pool.round_robin;
  } else if (action === 'add' && payload.model) {
    STATE.llm_pool.models.push(payload.model);
  } else if (action === 'delete' && payload.model_id) {
    STATE.llm_pool.models = (STATE.llm_pool.models || []).filter(x => x.id !== payload.model_id);
  }
  saveStateLocally();
  await refreshState();
}
